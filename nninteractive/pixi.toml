[workspace]
authors = ["Maarten Paul <maarten.paul@gmail.com>"]
channels = ["conda-forge"]
name = "nninteractive"
platforms = [
  { name = "linux-64-cuda", platform = "linux-64", cuda = "12.8" },
  { name = "linux-64-cpu", platform = "linux-64" },
  { name = "win-64-cuda", platform = "win-64", cuda = "12.8" },
  { name = "win-64-cpu", platform = "win-64" },
]
version = "0.1.0"

[tasks]
test-cuda = "python -c \"import torch; print(f'CUDA available: {torch.cuda.is_available()}'); print(f'CUDA version: {torch.version.cuda}'); print(f'Device count: {torch.cuda.device_count()}'); print(f'Current device: {torch.cuda.current_device() if torch.cuda.is_available() else None}'); print(f'Device name: {torch.cuda.get_device_name(0) if torch.cuda.is_available() else None}')\""

[tasks.test-plugins]
cmd = "python -c \"import npe2; pm = npe2.PluginManager.instance(); pm.discover(); names = [m.name for m in pm.iter_manifests()]; print('discovered plugins:', names); assert 'napari-nninteractive' in names, 'napari-nninteractive plugin not discovered'; assert 'napari-ome-zarr' in names, 'napari-ome-zarr plugin not discovered'; print('PLUGIN TEST PASSED')\""
env = { QT_QPA_PLATFORM = "offscreen" }

[tasks.test-plugins-omero]
cmd = "python -c \"import npe2; pm = npe2.PluginManager.instance(); pm.discover(); names = [m.name for m in pm.iter_manifests()]; print('discovered plugins:', names); assert 'napari-omero' in names, 'napari-omero plugin not discovered'; import omero.gateway; print('OMERO PLUGIN TEST PASSED')\""
env = { QT_QPA_PLATFORM = "offscreen" }

[dependencies]
python = "3.12.*"
pytorch = ">=2.7.1,<2.9"
numpy = "<2.3"

[pypi-dependencies]
#torch = "*"
#torchvision = "*"
nninteractive = ">=2.5.1, <3"
napari = { version = ">=0.8.0, <0.9", extras = ["all"] }
napari-nninteractive = ">=2.5.3, <3"
npe2 = ">=0.8.2"

# ---- remote data access: OME-Zarr ----
ome-zarr = "*"
napari-ome-zarr = "*"

# ---- optional OMERO stack: `pixi run -e omero ...` ----
# Kept out of the default environment because it drags in conda-only zeroc-ice
# (no Linux wheels on PyPI) pinned <3.7 by omero-py, plus numpy>=2.
# OME-Zarr stays in the default environment: it needs none of that.
[feature.omero.dependencies]
zeroc-ice = ">=3.6.5,<3.7"

[feature.omero.pypi-dependencies]
omero-py = "*"
napari-omero = { version = "*", extras = ["all"] }

[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu118"]
index-strategy = "unsafe-best-match"

[environments]
omero = ["omero"]
