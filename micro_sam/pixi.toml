[workspace]
channels = ["conda-forge"]
name = "micro_sam"
platforms = [
  { name = "linux-64-cuda", platform = "linux-64", cuda = "12.8" },
  { name = "linux-64-cpu", platform = "linux-64" },
  { name = "win-64-cuda", platform = "win-64", cuda = "12.8" },
  { name = "win-64-cpu", platform = "win-64" },
] #, "osx-64", "osx-arm64"
version = "0.1.0"

[tasks]
test-cuda = "python -c \"import torch; print(f'CUDA available: {torch.cuda.is_available()}'); print(f'CUDA version: {torch.version.cuda}'); print(f'Device count: {torch.cuda.device_count()}'); print(f'Current device: {torch.cuda.current_device() if torch.cuda.is_available() else None}'); print(f'Device name: {torch.cuda.get_device_name(0) if torch.cuda.is_available() else None}')\""

[tasks.test-plugins]
cmd = "python -c \"import napari, npe2; pm = npe2.PluginManager.instance(); pm.discover(); names = [m.name for m in pm.iter_manifests()]; print('discovered plugins:', names); assert 'micro-sam' in names, 'micro-sam plugin not discovered'; assert 'napari-omero' in names, 'napari-omero plugin not discovered'; v = napari.Viewer(show=False); v.close(); print('PLUGIN TEST PASSED')\""
env = { QT_QPA_PLATFORM = "offscreen" }


[dependencies]
python = "3.12.*"
micro_sam = ">=1.6.1,<2"
pytorch = ">=2.7.1,<3"
zeroc-ice = ">=3.6.5,<3.7"
jupyter = ">=1.1.1,<2"

[pypi-dependencies]
omero-py = "*"
napari-omero = { version = "*", extras = ["all"] }

# ---- remote data access: OME-Zarr ----
ome-zarr = "*"
napari-ome-zarr = "*"

