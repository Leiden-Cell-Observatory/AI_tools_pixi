[workspace]
authors = ["Maarten Paul <maarten.paul@gmail.com>"]
channels = ["conda-forge"]
name = "omero"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.12.*"
zeroc-ice = ">=3.6.5,<3.7"
jupyter = ">=1.1.1,<2"
ipykernel = "<7"  # napari-console <0.1.4 otherwise caps napari at 0.6.5

[pypi-dependencies]
napari = { version = "*", extras = ["all"] }
omero-py = "*"
napari-omero = { version = "*", extras = ["all"] }
ezomero = ">=3.2.0, <4"
matplotlib = ">=3.11.1, <4"

# ---- remote data access: OME-Zarr ----
ome-zarr = "*"
napari-ome-zarr = "*"

