[workspace]
authors = ["Maarten Paul <maarten.paul@gmail.com>"]
channels = ["conda-forge"]
name = "omero"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.11.*"
zeroc-ice = ">=3.6.5,<3.7"
jupyter = ">=1.1.1,<2"

[pypi-dependencies]
napari = { version = ">=0.6.5, <0.7", extras = ["all"] }
omero-py = "==5.21.1"
napari-omero = { version = ">=0.5.1, <0.6", extras = ["all"] }
ezomero = ">=3.2.0, <4"
matplotlib = ">=3.11.1, <4"
